# GitLab CI — the project's whole pipeline. Nothing here names a particular
# GitLab instance, registry, runner or Cloudflare account: everything that would
# is a CI/CD variable, so a fork runs this file unmodified.
#
# RUNNERS. Most jobs are Linux Docker; two are macOS (the Apple bsdiff build and
# its conformance gate) and need a runner with Xcode — a Tart VM, a self-hosted
# Mac, or GitLab's SaaS macOS runners. Pin both with $BU_CI_LINUX_TAG /
# $BU_CI_MACOS_TAG below. Give the Linux runner a persistent bun cache — mount a
# docker volume at /root/.bun/install/cache in its config.toml — so `bun install`
# hardlinks from a warm cache instead of re-extracting native tarballs every job.
# That is what stops the recurring "Fail extracting tarball" flake; the retry
# loop in bun_ci_install is only a seatbelt for a cold cache entry.
#
# The CLI ships as a standalone `bun build --compile` binary for 5 platforms:
# macOS arm64 (built on the Mac runner) + Linux x64/arm64 in both gnu and musl
# (cross-compiled on Linux). The embedded @better-update/bsdiff native addon is
# built per target the same way (napi-cross / cargo-zigbuild). Windows and
# Intel-mac are NOT built.
#
# CI/CD VARIABLES (Settings → CI/CD → Variables). Project variables override the
# `variables:` defaults below.
#
#   Deploy identity — the repository tracks NO deployment identity, so both
#   deploy jobs need the BU_* keys that describe the target instance. The full
#   list, with which are required, is `.env.deploy.example`; `config:gen:strict`
#   fails the job if a required one is missing, so a misconfigured pipeline can
#   never deploy a placeholder.
#     required  BU_CF_ACCOUNT_ID BU_APP_HOST BU_ASSET_CDN_HOST BU_EMAIL_SENDER
#               BU_D1_DATABASE_ID BU_KV_SESSION_ID BU_KV_BUILD_RESERVATIONS_ID
#     as needed BU_CF_ZONE_ID BU_VAULT_HOST BU_*_WORKER_NAME
#               BU_D1_DATABASE_NAME BU_R2_* BU_SUPERADMIN_EMAILS BU_*_CLIENT_ID
#
#   Credentials (masked + protected)
#     CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  — deploy-server / deploy-web
#     GITHUB_RELEASE_TOKEN                         — release + publish-cli: pushes
#         the CLI tag to the GitHub mirror named by BU_CLI_RELEASE_REPO and
#         uploads the binaries to its GitHub Release (what install.sh reads).
#         Optional: without it the binaries only land on the GitLab Release.
#     GITLAB_RELEASE_TOKEN                         — release (project/group access
#         token, scopes write_repository + api; pushes the version commit + tags
#         AND creates GitLab Releases; pushing tags with a real token is what
#         triggers the downstream deploy/publish pipelines).
#
#   Pipeline knobs — BU_CI_*, documented at `variables:` below. These configure
#   the RUNNERS, not the deployment; `config:gen` ignores them.
#     required  BU_CI_LINUX_TAG BU_CI_MACOS_TAG  (the tracked values are
#               placeholders — a job whose tag matches no runner never starts)
#     optional  BU_CI_IMAGE BU_CI_MACOS_IMAGE

stages:
  - test
  - release
  - deploy
  - build-native
  - build-cli
  - publish

variables:
  # Image for the Linux jobs. The default is plain upstream node — `.ci-setup`
  # then installs whatever the job needs (apt build deps, rustup + cross targets,
  # zig) at the cost of a few minutes per job. Build `ci/Dockerfile` once, push
  # it to a registry your runners can pull, and point this at it: every install
  # step becomes a no-op.
  BU_CI_IMAGE: "node:24-bookworm"
  # Runner selection — SET THESE FIRST. The values below are placeholders; a job
  # whose tag matches no runner sits pending forever, so override both with your
  # own runners' tags. They cannot default to "no tag": a mixed Linux/macOS fleet
  # has to be told apart, and GitLab does not document what an empty tag does.
  BU_CI_LINUX_TAG: "linux"
  BU_CI_MACOS_TAG: "macos"
  # Image for the two macOS jobs. On a Tart runner this must already be present
  # locally (`tart list`) or the runner pulls ~30GB. Ignored by runner executors
  # that manage their own VM image.
  BU_CI_MACOS_IMAGE: "ghcr.io/cirruslabs/macos-tahoe-xcode:26.5"
  # bun is baked into a prebuilt BU_CI_IMAGE; this pins the version installed
  # in-job when it is missing (plain node image, macOS runners).
  BUN_VERSION: "1.4.2"
  # Zig, for the musl cross-builds (`napi build -x`). Also only installed in-job
  # when missing; keep in sync with ci/Dockerfile.
  ZIG_VERSION: "0.16.0"
  # Cap bun's parallel downloads/extractions so concurrent jobs on the same
  # runner don't contend and fail tarball extraction (default is 256).
  BUN_CONFIG_MAX_HTTP_REQUESTS: "32"
  # Bun + Rust use DEFAULT homes (~/.bun, ~/.cargo, ~/.rustup), NOT project-dir
  # homes: (a) `turbo run build` strict-env strips CARGO_HOME/RUSTUP_HOME so a
  # redirected rust home is invisible to napi/cargo ("no default toolchain"); (b)
  # an in-project bun cache gets scanned by `oxfmt --check .` (the lint job + the
  # lefthook release commit) and fails on vendored files. HOME + PATH always pass
  # through, so default homes work; only bsdiff target/ is cached.

# Only build pipelines we care about: merge requests, tags, and the default
# branch (whose pipeline carries the manual `release` job).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Shared shell, pulled into every before_script via a single !reference. It only
# DEFINES functions — each template calls the ones it needs.
#
# Every ensure_* function is idempotent and exits immediately when the tool is
# already present, so they cost nothing on a prebuilt $BU_CI_IMAGE (ci/Dockerfile
# bakes in bun + rust + cross targets + zig/cargo-zigbuild + node-gyp + libbz2 +
# jq) and bootstrap a plain `node:24-bookworm` — or a macOS runner — on demand.
#
#  - bun_ci_install(): resilient `bun install`. The real fix for the recurring
#    "Fail extracting tarball" flake (rspack/rolldown/tsgo native bindings, etc.)
#    is a PERSISTENT bun cache: mount a docker volume at
#    /root/.bun/install/cache on the Linux runner (see [runners.docker] volumes
#    in its config.toml). A warm cache HARDLINKS packages into node_modules and
#    skips tarball extraction entirely, so the flake can only occur on a COLD
#    entry (a newly-bumped dep). This retry loop is the seatbelt for that cold
#    case: a `timeout` kills any extraction hang, and — crucially — the first
#    retry keeps the warm cache and only drops node_modules; the whole cache is
#    cleared only as a LAST resort (nuking it would force a full cold
#    re-download and re-roll the extraction dice on every following job).
#  - ensure_build_deps(): node-pty (a CLI test dependency) has no linux-x64
#    prebuild, so it compiles → node-gyp + a C toolchain. Also libbz2 (bsdiff
#    conformance links expo's bspatch.c) and jq (the release job).
.ci-setup:
  before_script:
    - |
      # PATH goes on FIRST in both: on a persistent runner the toolchain already
      # lives in $HOME but is not on a fresh job's PATH, and probing before the
      # export would re-download it every single job.
      ensure_bun() {
        export PATH="$HOME/.bun/bin:$PATH"
        if [ "$(bun --version 2>/dev/null)" != "$BUN_VERSION" ]; then
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
        fi
      }

      ensure_rust() {
        export PATH="$HOME/.cargo/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
        fi
        rustup default stable
      }

      ensure_build_deps() {
        if command -v apt-get >/dev/null 2>&1 &&
           { ! command -v node-gyp >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; }; then
          apt-get update
          apt-get install -y --no-install-recommends python3 make g++ libbz2-dev jq clang lld
        fi
        command -v node-gyp >/dev/null 2>&1 || npm install -g node-gyp || true
      }

      # musl cross-compilation only (`napi build -x`). Slow to install from
      # scratch — a prebuilt $BU_CI_IMAGE already has it.
      ensure_zig() {
        command -v cargo-zigbuild >/dev/null 2>&1 && command -v zig >/dev/null 2>&1 && return 0
        if command -v brew >/dev/null 2>&1; then
          brew install zig
        else
          # The tarball is per-arch (zig-<arch>-linux-<ver>, arch BEFORE os) —
          # never hardcode x86_64 or an arm64 runner gets "Exec format error".
          zig_arch="$(uname -m)"
          [ "$zig_arch" = "arm64" ] && zig_arch="aarch64"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${zig_arch}-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C /usr/local
          mv "/usr/local/zig-${zig_arch}-linux-${ZIG_VERSION}" /usr/local/zig
          export PATH="/usr/local/zig:$PATH"
        fi
        cargo install --locked cargo-zigbuild
      }
    - |
      bun_ci_install() {
        # `timeout` is GNU-only (Linux). macOS has it as `gtimeout` (coreutils) or
        # not at all — fall back to a plain install there (the Mac runner is
        # dedicated, so it doesn't hit the shared-runner extraction contention).
        for a in 1 2 3; do
          if command -v timeout >/dev/null 2>&1; then
            timeout 600 bun install --frozen-lockfile && return 0
          elif command -v gtimeout >/dev/null 2>&1; then
            gtimeout 600 bun install --frozen-lockfile && return 0
          else
            bun install --frozen-lockfile && return 0
          fi
          df -h / 2>/dev/null || true
          if [ "$a" -ge 2 ]; then
            # Last resort: the warm cache itself may be corrupt — nuke it.
            echo ">> bun install attempt $a failed; clearing bun cache (last resort), then retry" >&2
            rm -rf node_modules "$HOME/.bun/install/cache" 2>/dev/null || true
          else
            # Keep the persistent warm cache; a fresh node_modules is enough to
            # recover a transient cold-extraction flake without a full re-download.
            echo ">> bun install attempt $a failed; keeping warm cache, dropping node_modules, then retry" >&2
            rm -rf node_modules 2>/dev/null || true
          fi
          sleep 5
        done
        echo ">> bun install failed after 3 attempts" >&2
        return 1
      }

.base-bun:
  image: $BU_CI_IMAGE
  tags:
    - $BU_CI_LINUX_TAG
  interruptible: true
  # `bun install` can flake extracting big native tarballs (e.g. sharp/libvips);
  # retry the job, and bound any hang so it doesn't sit until the global timeout.
  timeout: 30m
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
    - echo "nofile soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
    - !reference [.ci-setup, before_script]
    - ensure_bun
    - ensure_build_deps
    # Only the Rust jobs pay for the toolchain; .base-rust flips this on.
    - if [ "${NEEDS_RUST:-0}" = "1" ]; then ensure_rust; fi
    - bun --version

# Adds the Rust toolchain + the cargo target/ cache on top of .base-bun. Both
# are no-ops on a prebuilt $BU_CI_IMAGE, which already has rust + cross targets.
.base-rust:
  extends: .base-bun
  variables:
    NEEDS_RUST: "1"
  cache:
    - key:
        files:
          - packages/bsdiff/Cargo.lock
      paths:
        - packages/bsdiff/target

# macOS runner (the two Apple bsdiff jobs). Same bootstrap, but the VM image +
# tag select the Mac and there is no apt/cache — these VMs are ephemeral, so
# nothing can be prebaked and every ensure_* actually runs.
.macos-rust:
  image: $BU_CI_MACOS_IMAGE
  tags:
    - $BU_CI_MACOS_TAG
  interruptible: true
  # Generous: a cold pull of the ~30GB Tart VM image (if evicted from the runner)
  # can take a long time; once cached, real runs are minutes. Capped by the
  # project max job timeout (raised to 3h) and the runner's own max_timeout.
  timeout: 2h
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
    - echo "nofile soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
    - !reference [.ci-setup, before_script]
    - ensure_bun
    - ensure_rust
    - ensure_build_deps
    - bun --version && cargo --version

# ---------------------------------------------------------------------------
# test (merge requests)
# ---------------------------------------------------------------------------

# The merge-request gate: lint + format + unit tests + build. `bun run
# test`/`build` fan out via turbo and compile the git-ignored bsdiff native
# addon, hence Rust.
lint-test-build:
  extends: .base-rust
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bun_ci_install
    - bun run typegen:cf
    - bun run check
    - bun run test
    - bun run build

# Local vitest-pool-workers e2e suite (no Rust, no Cloudflare creds). Remote-R2
# e2e (test:e2e-r2) is intentionally skipped here.
#
# NOT a merge-request gate: MRs gate on lint + unit (`lint-test-build`) and
# `integrations` only. This job is kept as an on-demand, non-blocking manual job
# on MR pipelines — hit the play button in the pipeline UI to run the e2e suite
# when you want it; it never blocks the MR pipeline from going green.
e2e-server:
  extends: .base-bun
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - bun_ci_install
    - bun run typegen:cf
    - bun --filter @better-update/server test:e2e-pool

# Integration suite. Compiles bsdiff via turbo, hence Rust.
integrations:
  extends: .base-rust
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bun_ci_install
    - bun run typegen:cf
    - bun run test:integrations

# bsdiff conformance gate (the @better-update/bsdiff SHIP GATE) — Linux + macOS.
# Builds the host .node addon, then proves the
# BSDIFF40 patch applies byte-identically through expo's vendored bspatch.c
# (needs libbz2 + a C compiler). Runs when packages/bsdiff changes.
conformance:
  extends: .base-rust
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/bsdiff/**/*
  script:
    - bun_ci_install
    - bun --filter @better-update/bsdiff build
    - bun --filter @better-update/bsdiff test:conformance

conformance-macos:
  extends: .macos-rust
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/bsdiff/**/*
  script:
    - brew install bzip2
    - bun_ci_install
    - bun --filter @better-update/bsdiff build
    - bun --filter @better-update/bsdiff test:conformance

# ---------------------------------------------------------------------------
# release (manual, default branch) — Lerna independent version + tag push +
# GitLab Releases. Pushing the per-package tags here triggers the deploy /
# publish pipelines below.
# ---------------------------------------------------------------------------
release:
  extends: .base-rust
  stage: release
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  variables:
    GIT_DEPTH: "0" # full history + tags for conventional-commits / lerna
    # Skip lefthook on lerna's release commit — format/lint are gated on MRs, not
    # re-run for the automated `chore(release)` commit (equivalent to --no-verify).
    LEFTHOOK: "0"
    # Set DRY_RUN=true when running the manual job to preview without pushing.
    DRY_RUN: "false"
    # Set FORCE_PUBLISH to a package name (e.g. @better-update/cli) to cut a
    # patch release for it even when no conventional commit touched it — used
    # to re-run a tag pipeline after a CI-only fix.
    FORCE_PUBLISH: ""
  script:
    - bun_ci_install
    - bun run typegen:cf
    - bun run build

    - git config user.name "gitlab-ci"
    - git config user.email "ci@${CI_SERVER_HOST}"
    - git fetch --tags
    # Land on a real branch (CI checks out detached HEAD) so lerna's
    # allowBranch:main passes and we can push the version commit back.
    - git checkout -B "$CI_DEFAULT_BRANCH"

    - |
      if [ "$DRY_RUN" = "true" ]; then
        bun run release:preview
        echo "Dry run complete — no tags pushed."
        exit 0
      fi

    - bun run release:version ${FORCE_PUBLISH:+--force-publish="$FORCE_PUBLISH"}

    # Authenticated push URL (CI's default origin uses a read-only job token).
    - git remote set-url --push origin "https://oauth2:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push origin "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"

    # Push each new tag individually + create a GitLab Release for the public
    # packages; the private server/web/api tags are versioned but get no Release
    # entry.
    - |
      PUBLIC_PACKAGES="@better-update/cli"
      for tag in $(git tag --points-at HEAD); do
        echo "Pushing $tag"
        git push origin "refs/tags/$tag"
        sleep 2

        name="${tag%@*}"
        version="${tag##*@}"

        case " $PUBLIC_PACKAGES " in
          *" $name "*) ;;
          *) echo "Skipping Release for non-public package $name"; continue ;;
        esac

        pkg_dir=""
        for pj in apps/*/package.json packages/*/package.json; do
          if [ "$(jq -r .name "$pj")" = "$name" ]; then
            pkg_dir="$(dirname "$pj")"
            break
          fi
        done

        notes_file="$(mktemp)"
        if [ -n "$pkg_dir" ] && [ -f "$pkg_dir/CHANGELOG.md" ]; then
          awk -v ver="$version" '
            /^## (\[|[0-9])/ {
              if (found) exit
              if (index($0, "[" ver "]") || $0 ~ ("^## " ver "( |$)")) { found = 1; print; next }
              next
            }
            found { print }
          ' "$pkg_dir/CHANGELOG.md" > "$notes_file"
        fi

        if [ ! -s "$notes_file" ]; then
          printf 'Release %s\n' "$tag" > "$notes_file"
        fi

        # The CLI binaries are published to GitHub Releases (publish-cli), which
        # needs the tag — and its commit — on the mirror first.
        if [ -n "${GITHUB_RELEASE_TOKEN:-}" ] && [ "$name" = "@better-update/cli" ]; then
          echo "Pushing $tag to github.com/${BU_CLI_RELEASE_REPO:-aislopware/better-update}"
          git push "https://x-access-token:${GITHUB_RELEASE_TOKEN}@github.com/${BU_CLI_RELEASE_REPO:-aislopware/better-update}.git" "refs/tags/$tag"
        fi

        echo "Creating GitLab Release $tag"
        jq -n --arg tag "$tag" --rawfile notes "$notes_file" \
          '{tag_name: $tag, name: $tag, description: $notes}' \
          | curl --fail-with-body --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
              --header "Content-Type: application/json" \
              --data @- \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" > /dev/null
        rm -f "$notes_file"
      done

# ---------------------------------------------------------------------------
# deploy (tag-triggered) — apply D1 migrations + wrangler deploy to Cloudflare.
#
# The repository tracks NO deployment identity, so both deploy jobs need the
# BU_* CI variables that describe the target instance (see .env.deploy.example):
#   required  BU_CF_ACCOUNT_ID BU_APP_HOST BU_EMAIL_SENDER
#             BU_D1_DATABASE_ID BU_KV_SESSION_ID BU_KV_BUILD_RESERVATIONS_ID
#   as needed BU_CF_ZONE_ID BU_VAULT_HOST BU_ASSET_CDN_HOST BU_*_WORKER_NAME
#             BU_D1_DATABASE_NAME BU_R2_* BU_SUPERADMIN_EMAILS BU_*_CLIENT_ID
# `config:gen:strict` (run by both scripts below) fails the job if any required
# one is missing, so a misconfigured pipeline cannot deploy a placeholder.
# ---------------------------------------------------------------------------
deploy-server:
  extends: .base-bun
  stage: deploy
  interruptible: false
  resource_group: deploy-server # serialize concurrent deploys
  rules:
    - if: $CI_COMMIT_TAG =~ /^@better-update\/server@/
  script:
    - bun_ci_install
    - cd apps/server
    # Binding name, not database name — the D1 identity is rendered into
    # wrangler.jsonc from the BU_* variables above.
    - bun run d1:migrate:remote
    - bun run deploy

deploy-web:
  extends: .base-bun
  stage: deploy
  interruptible: false
  resource_group: deploy-web
  rules:
    - if: $CI_COMMIT_TAG =~ /^@better-update\/web@/
  script:
    - bun_ci_install
    - cd apps/web
    - bun run deploy

# ---------------------------------------------------------------------------
# publish (tag @better-update/cli@*) — the CLI ships as a `bun build --compile`
# standalone binary per platform (no Node / Bun on the user's machine):
# darwin-arm64 + linux x64/arm64 in both gnu and musl, matching bsdiff's napi
# targets. `install.sh` and the CLI's own update check download from GitHub
# Releases; the same files are attached to the GitLab Release as well.
#
# Flow: build the bsdiff native addon per target (it is embedded in the binary)
# → compile the CLI per target (macOS on the Mac runner, the four Linux targets
# cross-compiled on Linux) → publish-cli uploads the binaries + SHA256SUMS.
# ---------------------------------------------------------------------------

# Apple arm64 on the macOS Tart runner: native bsdiff addon, then the darwin
# CLI binary that embeds it.
build-cli-apple:
  extends: .macos-rust
  stage: build-native
  rules:
    - if: $CI_COMMIT_TAG =~ /^@better-update\/cli@/
  variables:
    TARGET: aarch64-apple-darwin
  script:
    - bun_ci_install
    - rustup target add "$TARGET"
    - cd packages/bsdiff && bun run build --target "$TARGET" && cd -
    # The CLI bakes its default server URL + release repo in at build time, so
    # a published binary must never be built on placeholders.
    - bun run config:gen:strict
    - cd apps/cli && bun scripts/build.ts --target darwin-arm64
  artifacts:
    paths:
      - apps/cli/dist/better-update-*
    expire_in: 1 day

# Linux bsdiff targets: gnu via napi-cross (portable glibc baseline), musl via
# cargo-zigbuild (`-x`). The cross targets + zig + cargo-zigbuild are baked into
# a prebuilt $BU_CI_IMAGE (ensure_zig installs them otherwise); napi-cross is
# fetched by napi at build time. The generated loader (index.js) is identical
# per target and travels with the .node so the compile job never has to run
# `napi build` on the host (which would rebuild linux-x64-gnu against the
# runner's own glibc).
build-bsdiff-linux:
  extends: .base-rust
  stage: build-native
  rules:
    - if: $CI_COMMIT_TAG =~ /^@better-update\/cli@/
  parallel:
    matrix:
      - TARGET: x86_64-unknown-linux-gnu
        FLAGS: "--use-napi-cross"
      - TARGET: aarch64-unknown-linux-gnu
        FLAGS: "--use-napi-cross"
      - TARGET: x86_64-unknown-linux-musl
        FLAGS: "-x"
      - TARGET: aarch64-unknown-linux-musl
        FLAGS: "-x"
  script:
    - bun_ci_install
    - rustup target add "$TARGET"
    - if [ "$FLAGS" = "-x" ]; then ensure_zig; fi
    - cd packages/bsdiff
    - bun run build --target "$TARGET" $FLAGS
  artifacts:
    paths:
      - packages/bsdiff/*.node
      - packages/bsdiff/index.js
      - packages/bsdiff/index.d.ts
    expire_in: 1 day

# The four Linux binaries, cross-compiled from one Linux job: bun downloads the
# target runtime, and every linux .node from the matrix above is on disk so the
# bundler embeds them.
build-cli-linux:
  extends: .base-bun
  stage: build-cli
  rules:
    - if: $CI_COMMIT_TAG =~ /^@better-update\/cli@/
  needs:
    - job: build-bsdiff-linux
      artifacts: true
  script:
    - bun_ci_install
    - ls -l packages/bsdiff/*.node
    - bun run config:gen:strict
    - cd apps/cli
    - for t in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do bun scripts/build.ts --target "$t"; done
  artifacts:
    paths:
      - apps/cli/dist/better-update-*
    expire_in: 1 day

# Upload the binaries + SHA256SUMS: to GitHub Releases (what `install.sh` and
# the CLI's update notice read — needs GITHUB_RELEASE_TOKEN, and the tag must
# exist on the mirror, which the release job pushes), to the GitLab Release
# (generic package registry + release asset links, for instances without a
# GitHub mirror). npm is not a distribution channel: @better-update/cli there is
# deprecated. BU_CLI_RELEASE_REPO selects the GitHub repo.
publish-cli:
  extends: .base-bun
  stage: publish
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^@better-update\/cli@/
  needs:
    - job: build-cli-apple
      artifacts: true
    - job: build-cli-linux
      artifacts: true
  script:
    - |
      VERSION="${CI_COMMIT_TAG##*@}"
      REPO="${BU_CLI_RELEASE_REPO:-aislopware/better-update}"
      mkdir -p release
      cp apps/cli/dist/better-update-* release/
      ( cd release && sha256sum better-update-* > SHA256SUMS && cat SHA256SUMS )
      ls -l release

      # --- GitHub Releases ---------------------------------------------------
      if [ -n "${GITHUB_RELEASE_TOKEN:-}" ]; then
        gh_api() { curl --fail-with-body --silent --show-error \
          --header "Authorization: Bearer ${GITHUB_RELEASE_TOKEN}" \
          --header "Accept: application/vnd.github+json" "$@"; }
        encoded_tag="$(jq -rn --arg t "$CI_COMMIT_TAG" '$t|@uri')"
        release_id="$(gh_api "https://api.github.com/repos/${REPO}/releases/tags/${encoded_tag}" 2>/dev/null | jq -r .id || true)"
        if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
          echo "Creating GitHub release $CI_COMMIT_TAG on $REPO"
          release_id="$(jq -n --arg tag "$CI_COMMIT_TAG" --arg sha "$CI_COMMIT_SHA" \
              '{tag_name: $tag, name: $tag, target_commitish: $sha, body: "See CHANGELOG.md in apps/cli.", draft: false, prerelease: false, make_latest: "true"}' \
            | gh_api --data @- "https://api.github.com/repos/${REPO}/releases" | jq -r .id)"
        fi
        for f in release/*; do
          name="$(basename "$f")"
          echo "Uploading $name to GitHub release $release_id"
          gh_api --header "Content-Type: application/octet-stream" \
            --data-binary "@$f" \
            "https://uploads.github.com/repos/${REPO}/releases/${release_id}/assets?name=${name}" > /dev/null
        done
      else
        echo "GITHUB_RELEASE_TOKEN not set — skipping GitHub Releases upload."
      fi

      # --- GitLab Release assets -----------------------------------------------
      pkg_base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/better-update-cli/${VERSION}"
      tag_path="$(jq -rn --arg t "$CI_COMMIT_TAG" '$t|@uri')"
      for f in release/*; do
        name="$(basename "$f")"
        echo "Uploading $name to the GitLab package registry"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${pkg_base}/${name}" > /dev/null
        jq -n --arg name "$name" --arg url "${pkg_base}/${name}" '{name: $name, url: $url, link_type: "package"}' \
          | curl --fail-with-body --silent --show-error \
              --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
              --header "Content-Type: application/json" --data @- \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${tag_path}/assets/links" > /dev/null
      done
